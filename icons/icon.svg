<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="50%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b3ed"/>
      <stop offset="50%" stop-color="#805ad5"/>
      <stop offset="100%" stop-color="#38b2ac"/>
    </linearGradient>

    <!-- Lightning Bolt & Shape Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b3ed"/>
      <stop offset="40%" stop-color="#4fd1c5"/>
      <stop offset="80%" stop-color="#805ad5"/>
      <stop offset="100%" stop-color="#d53f8c"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b3ed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#805ad5" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Dynamic Flyvest Symbol (Lightning / Rocket Bolt) -->
  <g transform="translate(256, 256) scale(1.15) translate(-256, -256)">
    <!-- Glow Layer -->
    <path d="M280 80 L160 270 L245 270 L210 432 L360 220 L275 220 Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="24" 
          stroke-linejoin="round" 
          filter="url(#glow)" 
          opacity="0.6"/>

    <!-- Main Solid Lightning Bolt -->
    <path d="M285 85 L165 270 L250 270 L215 427 L355 225 L280 225 Z" 
          fill="url(#primaryGrad)" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linejoin="round"/>

    <!-- Futuristic Accent Dots -->
    <circle cx="160" cy="140" r="8" fill="#63b3ed"/>
    <circle cx="370" cy="360" r="8" fill="#805ad5"/>
    <circle cx="380" cy="150" r="6" fill="#38b2ac"/>
    <circle cx="140" cy="370" r="6" fill="#ed8936"/>
  </g>
</svg>
